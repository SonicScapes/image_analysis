<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
  // Pretty per-scene URLs (/scene/<id>, serve.json rewrites those to this file) put the
  // document on a path this file doesn't actually live at, so every relative URL below —
  // the fonts, ./app.js, ./sphere.js — would resolve one or more folders too deep. Pin
  // the base back to where this file really is. Must run before anything relative loads,
  // which is why it is the very first thing in <head>.
  (function () {
    var m = location.pathname.match(/^(.*)\/scene\/[^/]+\/?$/);
    if (!m) return;
    var dir = m[1].replace(/\/index\.html$/, '');   // ".../index.html/scene/x" form too
    var b = document.createElement('base');
    b.href = dir + '/';
    document.head.appendChild(b);
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SoundScapes — Experience Sound &amp; Nature</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ink: #E6ECE8; --muted: #93A39C; --faint: #6B7A74;
    --panel: rgba(11,17,16,.76); --line: rgba(230,236,232,.16);
    --teal: #58B9BE; --moss: #92B981; --amber: #E09257;
  }
  * { box-sizing: border-box; }
  /* An id rule with `display` beats the browser's [hidden] { display: none }, so every
     hidden badge stayed visible. Make the attribute win. */
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: #0B100F; color: var(--ink); overflow: hidden;
    font-family: "Archivo", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    touch-action: none; user-select: none;
  }

  /* ---- panorama viewport ---- */
  #stage { position: fixed; inset: 0; overflow: hidden; cursor: grab; background: #0B100F; }
  #stage.dragging { cursor: grabbing; }
  #gl, #flat { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #flat { background-color: #0B100F; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(130% 90% at 50% 45%, transparent 40%, rgba(5,9,8,.55) 100%);
  }

  /* ---- gate ---- */
  #gate {
    position: fixed; inset: 0; z-index: 40; display: grid; place-items: center;
    background: radial-gradient(120% 90% at 50% 40%, #16211F 0%, #080C0B 72%);
    padding: 24px; text-align: center;
  }
  #gate .inner { max-width: 36rem; display: grid; gap: 1.2rem; justify-items: center; }
  #gate .kicker {
    font-family: "IBM Plex Mono", monospace; font-size: .7rem; letter-spacing: .16em;
    text-transform: uppercase; color: var(--teal);
  }
  #gate h1 { font-size: clamp(2rem, 6.5vw, 3.4rem); margin: 0; letter-spacing: -.022em; line-height: 1.03; }
  #gate p { margin: 0; color: var(--muted); font-size: 1.05rem; line-height: 1.5; max-width: 30rem; }
  #gate .hint { font-family: "IBM Plex Mono", monospace; font-size: .76rem; letter-spacing: .1em;
    text-transform: uppercase; color: var(--faint); }
  button.primary {
    font-family: "IBM Plex Mono", monospace; font-size: .82rem; letter-spacing: .14em;
    text-transform: uppercase; padding: .95rem 2.1rem; border-radius: 999px; cursor: pointer;
    background: var(--teal); color: #06100F; border: none; font-weight: 500;
  }
  button.primary:disabled { opacity: .45; cursor: progress; }
  button.primary:focus-visible, .ctl:focus-visible, input:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }

  /* ---- hud ---- */
  .hud {
    position: fixed; z-index: 20; background: var(--panel); border: 1px solid var(--line);
    border-radius: 4px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  #title { top: 16px; left: 16px; padding: .7rem .95rem; }
  #title .n { font-weight: 600; font-size: .98rem; }
  #title .s { font-family: "IBM Plex Mono", monospace; font-size: .7rem; color: var(--muted);
    letter-spacing: .08em; text-transform: uppercase; margin-top: .22rem; }

  #meters { top: 16px; right: 16px; width: 19rem; padding: .8rem .9rem; max-height: 60vh; overflow-y: auto; }
  #meters h2 { font-family: "IBM Plex Mono", monospace; font-size: .64rem; letter-spacing: .13em;
    text-transform: uppercase; color: var(--faint); margin: 0 0 .6rem; font-weight: 500; }
  .mrow { margin-bottom: .5rem; }
  .row { display: grid; grid-template-columns: 4.8rem 1fr 2.4rem; gap: .45rem; align-items: center; }
  .sub { display: flex; justify-content: space-between; gap: .5rem;
         font-family: "IBM Plex Mono", monospace; font-size: .6rem; color: var(--faint);
         padding-left: 5.25rem; margin-top: .12rem; }
  .sub .file { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub .pct { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  .mrow.event .sub .pct { color: var(--amber); }
  .row .lbl { font-family: "IBM Plex Mono", monospace; font-size: .68rem; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 5px; background: rgba(230,236,232,.1); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0%; background: var(--teal); border-radius: 3px; transition: width .1s linear; }
  .row.event .bar i { background: var(--amber); }
  .row.bed .bar i { background: var(--moss); }
  .row .db { font-family: "IBM Plex Mono", monospace; font-size: .63rem; color: var(--faint);
    text-align: right; font-variant-numeric: tabular-nums; }
  .row.fired .lbl { color: var(--amber); }

  .nav { display: flex; gap: .35rem; align-items: center; margin-top: .6rem; }
  .nav button {
    font-family: "IBM Plex Mono", monospace; font-size: .85rem; line-height: 1;
    width: 1.7rem; height: 1.7rem; border: 1px solid var(--line); border-radius: 3px;
    background: rgba(11,17,16,.9); color: var(--muted); cursor: pointer;
  }
  .nav button:hover:not(:disabled) { color: var(--teal); border-color: var(--teal); }
  .nav button:disabled { opacity: .3; cursor: not-allowed; }
  .nav select {
    flex: 1; min-width: 0; font-family: "IBM Plex Mono", monospace; font-size: .68rem;
    background: rgba(11,17,16,.9); color: var(--ink); border: 1px solid var(--line);
    border-radius: 3px; padding: .28rem .3rem;
  }
  #noAudio { display: inline-block; font-family: "IBM Plex Mono", monospace;
    font-size: .58rem; letter-spacing: .12em; text-transform: uppercase;
    color: var(--faint); border: 1px solid var(--line); border-radius: 2px;
    padding: .08rem .3rem; margin-left: .4rem; }

  .seg { display: flex; gap: 1px; margin-top: .55rem; background: var(--line);
         border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .seg button {
    flex: 1; font-family: "IBM Plex Mono", monospace; font-size: .62rem; letter-spacing: .08em;
    text-transform: uppercase; padding: .4rem .3rem; border: none; cursor: pointer;
    background: rgba(11,17,16,.9); color: var(--muted);
  }
  .seg button[aria-pressed="true"] { background: var(--teal); color: #06100F; }
  .seg button:disabled { opacity: .35; cursor: not-allowed; }
  .seg button:hover:not(:disabled):not([aria-pressed="true"]) { color: var(--ink); }

  #silentBadge { display: inline-block; font-family: "IBM Plex Mono", monospace;
    font-size: .58rem; letter-spacing: .12em; text-transform: uppercase;
    color: var(--amber); border: 1px solid var(--amber); border-radius: 2px;
    padding: .08rem .3rem; margin-left: .4rem; }

  button.ghost {
    font-family: "IBM Plex Mono", monospace; font-size: .72rem; letter-spacing: .12em;
    text-transform: uppercase; padding: .6rem 1.2rem; border-radius: 999px;
    cursor: pointer; background: transparent; color: var(--muted);
    border: 1px solid var(--line);
  }
  button.ghost:hover { color: var(--teal); border-color: var(--teal); }

  #compass { left: 16px; bottom: 16px; }
  #controls { right: 16px; bottom: 16px; padding: .85rem .95rem; display: grid; gap: .75rem; width: 16rem; }
  #controls label { font-family: "IBM Plex Mono", monospace; font-size: .64rem; letter-spacing: .1em;
    text-transform: uppercase; color: var(--faint); display: flex; justify-content: space-between; }
  #controls label b { color: var(--teal); font-weight: 500; }
  #controls .pressure label b { color: var(--amber); }
  input[type=range] { width: 100%; accent-color: var(--teal); margin: .15rem 0 0; }
  .pressure input[type=range] { accent-color: var(--amber); }
  .ctl { font-family: "IBM Plex Mono", monospace; font-size: .66rem; letter-spacing: .1em;
    text-transform: uppercase; background: transparent; color: var(--ink); cursor: pointer;
    border: 1px solid var(--line); border-radius: 3px; padding: .5rem; }
  .ctl:hover { border-color: var(--teal); color: var(--teal); }

  #err { position: fixed; z-index: 50; inset: auto 16px 16px 16px; padding: .8rem 1rem;
    background: #3A1D12; border: 1px solid var(--amber); border-radius: 4px; color: #FFD9BE;
    font-family: "IBM Plex Mono", monospace; font-size: .74rem; line-height: 1.5; display: none; }

  @media (max-width: 760px) {
    #meters, #compass { display: none; }
    #controls { left: 16px; right: 16px; width: auto; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div id="stage">
  <canvas id="gl" hidden></canvas>
  <div id="flat" hidden></div>
</div>
<div id="vignette"></div>

<div id="title" class="hud" hidden>
  <div class="n"><span id="poiName">—</span><span id="silentBadge" hidden>silent</span><span id="noAudio" hidden>no audio</span></div>
  <div class="s" id="placeName"></div>
  <div class="s" id="geo" hidden></div>
  <div class="s">bearing <span id="bearing">0°</span> · <span id="fovOut">0°</span> field of view</div>
  <div class="nav" id="sceneNav" hidden>
    <button id="prevScene" title="Previous scene (←)">&#8249;</button>
    <select id="sceneSelect" aria-label="Scene"></select>
    <button id="nextScene" title="Next scene (→)">&#8250;</button>
  </div>
  <div class="seg" id="sourceSwitch" role="group" aria-label="Displayed image">
    <button id="srcPhoto"   aria-pressed="true">Photo</button>
    <button id="srcOverlay" aria-pressed="false">Overlay</button>
    <button id="srcNamed"   aria-pressed="false">Named</button>
    <button id="srcLabels"  aria-pressed="false">Labels</button>
  </div>
  <div class="s" id="srcNote" hidden></div>
</div>

<div id="meters" class="hud" hidden>
  <h2>Live mix — what you see is what you hear</h2>
  <div id="rows"></div>
</div>

<svg id="compass" class="hud" width="132" height="132" viewBox="0 0 132 132" hidden aria-hidden="true">
  <circle cx="66" cy="66" r="52" fill="none" stroke="rgba(230,236,232,.18)"/>
  <circle cx="66" cy="66" r="26" fill="none" stroke="rgba(230,236,232,.09)"/>
  <path id="wedge" fill="rgba(88,185,190,.20)" stroke="rgba(88,185,190,.5)" stroke-width="1"></path>
  <g id="dots"></g>
  <text x="66" y="17" text-anchor="middle" fill="#6B7A74" font-family="IBM Plex Mono, monospace" font-size="9">N</text>
</svg>

<div id="controls" class="hud" hidden>
  <div>
    <label for="scenic">Scenicness <b id="scenicVal">8.0</b></label>
    <input type="range" id="scenic" min="0" max="10" step="0.1" value="8">
  </div>
  <div class="pressure">
    <label for="pressure">Human pressure <b id="pressureVal">0.0</b></label>
    <input type="range" id="pressure" min="0" max="10" step="0.1" value="0">
  </div>
  <button class="ctl" id="gyroBtn" hidden>Use device motion</button>
</div>

<div id="gate">
  <div class="inner">
    <p class="kicker">Nationalpark Hohe Tauern · recorded on site</p>
    <h1 id="gateTitle">Hohe Tauern</h1>
    <p>Put on headphones and look around. What you turn towards is what you hear — mixed live from recordings made at this spot.</p>
    <button class="primary" id="startBtn">Listen</button>
    <button class="ghost" id="exploreBtn">Explore without sound</button>
    <p class="hint" id="status">headphones required</p>
  </div>
</div>

<div id="err"></div>

<script>
  // Runs BEFORE the module, and plainly, so it works even if the module never loads.
  // A button that does nothing almost always means app.js threw while loading and the
  // click handler was never attached — a failure the page would otherwise keep to itself.
  (function () {
    var box = document.getElementById('err');
    var shown = false;
    function show(what, detail) {
      shown = true;
      box.innerHTML = '<b>' + what + '</b><br>' + detail +
        '<br><br>Open the console (Cmd+Opt+J) for the full trace.';
      box.style.display = 'block';
      var st = document.getElementById('status');
      if (st) st.textContent = what;
    }
    window.addEventListener('error', function (e) {
      if (e.message === 'Script error.' && !e.filename) return;
      show('Script error', (e.message || 'unknown') +
           (e.filename ? '<br>' + e.filename + ':' + e.lineno : ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      show('Unhandled promise rejection', (e.reason && e.reason.message) || e.reason);
    });
    // If the module never signals that it booted, find out WHY rather than guessing.
    // The usual causes are environmental, not syntactic: the server rooted at the app
    // folder so ../engine/ escapes it, a .js served as text/plain (which a module
    // loader refuses), or the page opened from file://.
    window.addEventListener('load', function () {
      setTimeout(async function () {
        if (window.__soundscapesReady || shown) return;
        var lines = [];
        // The commonest cause, and it hides in plain sight: `serve` strips ".html"
        // and then "/index", leaving the page on a path with NO TRAILING SLASH. Every
        // relative URL then resolves one directory too high, so ./app.js becomes
        // /src/js/app.js. serve.json in the repo root turns that off.
        if (!/\/$|\.html$|\/scene\/[^/]+\/?$/.test(location.pathname)) {
          lines.push('The URL is <code>' + location.pathname + '</code> — no trailing ' +
                     'slash and no <code>.html</code>, so the server rewrote it and every ' +
                     'relative path now resolves one folder too high. Restart the server ' +
                     'so it picks up <code>serve.json</code> (<code>cleanUrls: false</code>), ' +
                     'or use <code>python3 -m http.server 3000</code> from the repo root.');
        }
        if (location.protocol === 'file:') {
          lines.push('The page is on <code>file://</code>. ES modules and fetch need ' +
                     'http — run <code>npm run dev</code> and open ' +
                     '<code>localhost:3000/src/js/app/index.html</code>.');
        }
        for (const rel of ['./app.js', './sphere.js', '../engine/soundscape-engine.js']) {
          try {
            const r = await fetch(new URL(rel, document.baseURI).href, { cache: 'no-store' });
            const ct = r.headers.get('content-type') || '(none)';
            if (!r.ok) {
              lines.push(rel + ' -> <b>HTTP ' + r.status + '</b> (resolved to ' +
                         new URL(rel, document.baseURI).pathname + ')');
            } else if (!/javascript|ecmascript/i.test(ct)) {
              lines.push(rel + ' -> served as <b>' + ct + '</b>. A module loader ' +
                         'refuses anything that is not a JavaScript MIME type.');
            } else {
              lines.push(rel + ' -> ok (' + r.status + ', ' + ct + ')');
            }
          } catch (err) {
            lines.push(rel + ' -> <b>unreachable</b> (' + err.message + ')');
          }
        }
        lines.push('If both are ok, the module threw at load — the Console has the ' +
                   'real error, and a hard reload (Cmd+Shift+R) rules out a stale cache.');
        show('app.js did not load', lines.join('<br>'));
      }, 1500);
    });
  })();
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
